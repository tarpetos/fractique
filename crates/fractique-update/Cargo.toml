[package]
name = "fractique-update"
description = "How the command line programs of Fractique update themselves"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["tool"]
# Everything but the key and the repository's name: the app takes only those two.
tool = [
    "dep:base64",
    "dep:clap",
    "dep:flate2",
    "dep:minisign-verify",
    "dep:semver",
    "dep:serde",
    "dep:serde_json",
    "dep:tar",
    "dep:ureq",
]

[dependencies]
base64 = { version = "0.23", optional = true }
clap = { version = "4.6.8", features = ["derive"], optional = true }
flate2 = { version = "1", optional = true }
minisign-verify = { version = "0.2.5", optional = true }
semver = { version = "1", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tar = { version = "0.4", default-features = false, optional = true }
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
