[package]
name = "fractique-server"
description = "HTTP API and web UI server for Fractique"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "fractique-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.6.8", features = ["derive", "env"] }
flate2 = "1.1"
fractique-core = { path = "../fractique-core" }
fractique-mcp = { path = "../fractique-mcp" }
fractique-update = { path = "../fractique-update" }
futures-core = "0.3.34"
getrandom = "0.3.4"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6.11", features = ["fs"] }

[dev-dependencies]
png = "0.18.1"
tokio = { version = "1.54", features = ["io-util"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
