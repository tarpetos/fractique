[package]
name = "fractique-cli"
description = "Command line renderer for Fractique scenes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "fractique"
path = "src/main.rs"

[[bin]]
name = "fractique-mcp"
path = "src/mcp_main.rs"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
fractique-core = { path = "../fractique-core" }
fractique-mcp = { path = "../fractique-mcp" }
serde_json.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
