[package]
name = "fractique-app"
description = "The Fractique app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fractique-gui"
path = "src/main.rs"

[features]
# The App Store builds: an export of 2560 × 1440 pixels or more needs the purchase "Fractique Pro".
store = []

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "persistence", "links", "x11", "wayland"] }
png = "0.18.1"
log = "0.4.35"
web-time = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fractique-core = { path = "../fractique-core" }
rayon.workspace = true
sys-locale = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
fractique-core = { path = "../fractique-core", default-features = false }
wasm-bindgen-futures = "0.4"
sys-locale = { version = "0.3", features = ["js"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "console"] }
wgpu = { version = "30", default-features = false, features = ["webgl", "webgpu", "wgsl"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "persistence", "android-native-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
jni = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
cargo-packager-updater = "0.2.3"
fractique-update = { path = "../fractique-update", default-features = false }
interprocess = "2.4"
rfd = "0.18.0"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false }
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[target.'cfg(target_os = "ios")'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2 = "0.6"

[package.metadata.android]
package = "app.fractique"
resources = "android/res"
# 64-bit phones, and the 32-bit ones still sold a few years ago.
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

# Android 9 and older add a picture to the gallery only with this; newer ones need nothing.
[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 28

# The short tick of a Back that has nothing to go back to. It is granted without a dialog.
[[package.metadata.android.uses_permission]]
name = "android.permission.VIBRATE"

[package.metadata.android.application]
label = "Fractique"
icon = "@mipmap/ic_launcher"
# Without it Android keeps room for a title bar the app never shows, and the layout starts 56 dp too low.
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[lints]
workspace = true
