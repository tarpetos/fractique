[workspace]
resolver = "3"
members = ["crates/fractique-core", "crates/fractique-mcp", "crates/fractique-update", "crates/fractique-cli", "crates/fractique-server", "crates/fractique-app"]
exclude = ["vendor"]

[workspace.package]
version = "1.0.2"
edition = "2024"
rust-version = "1.95"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/tarpetos/fractique"
publish = false

[workspace.dependencies]
libm = "0.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[patch.crates-io]
eframe = { path = "vendor/eframe" }
egui-wgpu = { path = "vendor/egui-wgpu" }

[workspace.lints.clippy]
disallowed_methods = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
