[workspace]
resolver = "3"
members = ["crates/fractique-core", "crates/fractique-cli", "crates/fractique-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/tarpetos/fractique"
publish = false

[workspace.dependencies]
libm = "0.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.clippy]
disallowed_methods = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
