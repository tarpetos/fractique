# The build for the Mac App Store: built, signed and checked by App Store Connect here, uploaded by release.yml once every
# platform of the release is built. docs/ios.md says how to make the key and the certificate in the secrets.
name: Release Mac App Store

on:
  workflow_call:
    secrets:
      ASC_KEY_P8:
        required: false
      ASC_KEY_ID:
        required: false
      ASC_ISSUER_ID:
        required: false
      APPLE_DISTRIBUTION_P12:
        required: false
      APPLE_DISTRIBUTION_P12_PASSWORD:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  appstore:
    name: Mac App Store
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The newest Xcode on the runner
        run: |
          newest="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -n1)"
          sudo xcode-select -s "$newest"
          xcodebuild -version
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: xcodegen
        run: brew install xcodegen
      - uses: ./.github/actions/apple-signing
        with:
          key-p8: ${{ secrets.ASC_KEY_P8 }}
          key-id: ${{ secrets.ASC_KEY_ID }}
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          certificate-p12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          certificate-password: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
      - name: Build and sign
        run: ./scripts/mac/appstore.sh --export
      # App Review refuses a private API; a dependency once linked one (_CGSSetWindowBackgroundBlurRadius, from winit).
      - name: No private window-server API
        run: |
          nm -u target/mac-app-store/fractique-gui | grep CGS || true
          # A universal file lists its symbols once for each processor.
          extra="$(nm -u target/mac-app-store/fractique-gui | grep CGS | grep -v '_CGShieldingWindowLevel$' || true)"
          if [ -n "$extra" ]; then
            echo "::error::The Mac build links a private API beside _CGShieldingWindowLevel."
            exit 1
          fi
      # A version App Store Connect no longer takes, or a build it would refuse, fails here, before anything is uploaded.
      - name: App Store Connect checks it
        run: xcrun altool --validate-app --type macos --file mac/build/export/*.pkg --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appstore-macos
          path: mac/build/export/*.pkg
          if-no-files-found: error
          retention-days: 7
