name: Release

# Entry point for a release: release-desktop.yml, release-android.yml, release-ios.yml, release-mac.yml and
# release-docker.yml run from here, side by side.
on:
  # Only for a release (a version tag) or when started by hand: never on every push or pull request.
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: What to build
        type: choice
        options: [all, ios, mac, docker]
        default: all

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the version is the same everywhere
        run: |
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)"
          packaged="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' crates/fractique-app/Packager.toml | head -n1)"
          ios="$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' ios/project.yml | head -n1)"
          mac="$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' mac/project.yml | head -n1)"
          failed=0
          differs() { echo "::error::$1 says $2, Cargo.toml says $version"; failed=1; }
          [ "$packaged" = "$version" ] || differs crates/fractique-app/Packager.toml "$packaged"
          [ "$ios" = "$version" ] || differs ios/project.yml "$ios"
          [ "$mac" = "$version" ] || differs mac/project.yml "$mac"
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            differs "The tag $GITHUB_REF_NAME" "${GITHUB_REF_NAME#v}"
          fi
          exit "$failed"

  desktop:
    name: Desktop
    needs: version
    # A tag has no input: everything is built.
    if: inputs.platforms == '' || inputs.platforms == 'all'
    uses: ./.github/workflows/release-desktop.yml
    secrets:
      CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
      CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}

  android:
    name: Android
    needs: version
    if: inputs.platforms == '' || inputs.platforms == 'all'
    uses: ./.github/workflows/release-android.yml
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

  # Not needed by the publishing: a refusal by Apple must not hold the installers back.
  ios:
    name: iOS
    needs: version
    # Started by hand only: a tag publishes the downloads, and the stores get the build that was tested.
    if: inputs.platforms == 'all' || inputs.platforms == 'ios'
    uses: ./.github/workflows/release-ios.yml
    secrets:
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

  # The build for the Mac App Store, with the same key; the .dmg of the release is the desktop job's.
  mac:
    name: Mac App Store
    needs: version
    if: inputs.platforms == 'all' || inputs.platforms == 'mac'
    uses: ./.github/workflows/release-mac.yml
    secrets:
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

  # Not needed by the publishing either: the image goes to the GitHub Container Registry, not into the release's files.
  docker:
    name: Docker
    needs: version
    if: inputs.platforms == '' || inputs.platforms == 'all' || inputs.platforms == 'docker'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-docker.yml

  publish:
    name: Publish release
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: out
          merge-multiple: true

      - name: Release notes, update manifests and checksums
        run: |
          awk -v v="## $VERSION" '$0 == v {on = 1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          # GitHub lists the files by name in one long list: the notes open with the same files by system.
          link() { echo "[$1]($base/$2)"; }
          v="$VERSION"
          {
            echo "## Downloads"
            echo
            echo "| System | The app | Command line tool | MCP server | HTTP server |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| Windows | $(link .exe "Fractique_${v}_x64.exe") | $(link .exe "fractique-cli_${v}_x64.exe") | $(link .exe "fractique-mcp_${v}_x64.exe") | $(link .exe "fractique-server_${v}_x64.exe") |"
            echo "| Linux | $(link AppImage "Fractique_${v}_x86_64.AppImage"), $(link .deb "Fractique_${v}_amd64.deb") | $(link .tar.gz "fractique-cli_${v}_x86_64-linux.tar.gz") | $(link .tar.gz "fractique-mcp_${v}_x86_64-linux.tar.gz") | $(link .tar.gz "fractique-server_${v}_x86_64-linux.tar.gz") |"
            echo "| macOS, every Mac | $(link .dmg "Fractique_${v}_universal.dmg") | $(link .tar.gz "fractique-cli_${v}_universal-macos.tar.gz") | $(link .tar.gz "fractique-mcp_${v}_universal-macos.tar.gz") | $(link .tar.gz "fractique-server_${v}_universal-macos.tar.gz") |"
            echo "| Android | $(link .apk "Fractique_${v}_android.apk") | | | |"
            echo "| Docker | | | | \`docker run -p 8080:8080 ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fractique-server:${v}\` |"
            echo
            echo "The Linux and macOS packages of the app hold the three other programs too. The other files of the list below are what the updates read."
            echo
            echo "## What's new"
            echo
            cat notes.md
          } > body.md
          cd out
          # cargo-packager names the installers after the main binary.
          for f in fractique-gui_*; do
            [ -e "$f" ] && mv "$f" "Fractique_${f#fractique-gui_}"
          done
          # One manifest entry: <os>-<arch>, a file pattern and the updater's format for it.
          entry() {
            f="$(ls $2 2>/dev/null | head -n1)"
            if [ -z "$f" ] || [ ! -f "$f.sig" ]; then
              echo "::warning::No signed $2: $1 gets no automatic update." >&2
              return
            fi
            jq -n --arg k "$1" --arg url "$base/$f" --arg sig "$(cat "$f.sig")" --arg fmt "$3" \
              '{($k): {url: $url, signature: $sig, format: $fmt}}'
          }
          {
            # Windows has no installer: the app replaces its own file. "nsis" is only the name the manifest format wants.
            entry windows-x86_64 'Fractique_*_x64.exe' nsis
            entry linux-x86_64 'Fractique_*_x86_64.AppImage' appimage
            # One universal app for both kinds of Mac.
            entry macos-aarch64 '*_universal.app.tar.gz' app
            entry macos-x86_64 '*_universal.app.tar.gz' app
          } | jq -s 'add // {}' > ../platforms.json
          jq -n --arg v "$VERSION" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --rawfile n ../notes.md \
            --slurpfile p ../platforms.json '{version: $v, notes: $n, pub_date: $d, platforms: $p[0]}' > latest.json
          # One program of tools.json for one system: its name, <os>-<arch> and a file pattern.
          tool() {
            f="$(ls $3 2>/dev/null | head -n1)"
            if [ -z "$f" ] || [ ! -f "$f.sig" ]; then
              echo "::warning::No signed $3: $1 does not update itself on $2." >&2
              return
            fi
            jq -n --arg p "$1" --arg k "$2" --arg url "$base/$f" --arg sig "$(cat "$f.sig")" \
              '{($p): {($k): {url: $url, signature: $sig}}}'
          }
          for p in fractique-cli fractique-mcp fractique-server; do
            tool "$p" windows-x86_64 "${p}_*_x64.exe"
            tool "$p" linux-x86_64 "${p}_*_x86_64-linux.tar.gz"
            tool "$p" macos-aarch64 "${p}_*_universal-macos.tar.gz"
            tool "$p" macos-x86_64 "${p}_*_universal-macos.tar.gz"
          done | jq -s 'reduce .[] as $e ({}; . * $e)' > ../programs.json
          jq -n --arg v "$VERSION" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --slurpfile p ../programs.json \
            '{version: $v, pub_date: $d, programs: $p[0]}' > tools.json
          # The updaters read each signature from latest.json and tools.json, so the .sig files are not published.
          rm -f ./*.sig
          sha256sum -- * > SHA256SUMS.txt
          jq . latest.json tools.json
          ls -l

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            # A full release, not a pre-release: the updater reads releases/latest, which skips pre-releases.
            gh release create "$GITHUB_REF_NAME" out/* --latest --title "$GITHUB_REF_NAME" --notes-file body.md
          fi
