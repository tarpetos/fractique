name: Release

# Entry point for a release: release-desktop.yml, release-android.yml and release-ios.yml run from here, side by side.
on:
  # Only for a release (a version tag) or when started by hand: never on every push or pull request.
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: What to build
        type: choice
        options: [all, ios]
        default: all

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version $version in Cargo.toml"
            exit 1
          fi

  desktop:
    name: Desktop
    needs: version
    if: inputs.platforms != 'ios'
    uses: ./.github/workflows/release-desktop.yml
    secrets:
      CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
      CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}

  android:
    name: Android
    needs: version
    if: inputs.platforms != 'ios'
    uses: ./.github/workflows/release-android.yml
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

  # Not needed by the publishing: a refusal by Apple must not hold the installers back.
  ios:
    name: iOS
    needs: version
    uses: ./.github/workflows/release-ios.yml
    secrets:
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

  publish:
    name: Publish release
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: The version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: out
          merge-multiple: true

      - name: Release notes, update manifest and checksums
        run: |
          awk -v v="## $VERSION" '$0 == v {on = 1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
          cd out
          # cargo-packager names the installers after the main binary.
          for f in fractique-gui_*; do
            [ -e "$f" ] && mv "$f" "Fractique_${f#fractique-gui_}"
          done
          if [ -f Fractique.app.tar.gz ]; then
            mv Fractique.app.tar.gz "Fractique_${VERSION}_aarch64.app.tar.gz"
            mv Fractique.app.tar.gz.sig "Fractique_${VERSION}_aarch64.app.tar.gz.sig"
          fi
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          # One manifest entry: <os>-<arch>, a file pattern and the updater's format for it.
          entry() {
            f="$(ls $2 2>/dev/null | head -n1)"
            if [ -z "$f" ] || [ ! -f "$f.sig" ]; then
              echo "::warning::No signed $2: $1 gets no automatic update."
              return
            fi
            jq -n --arg k "$1" --arg url "$base/$f" --arg sig "$(cat "$f.sig")" --arg fmt "$3" \
              '{($k): {url: $url, signature: $sig, format: $fmt}}'
          }
          {
            # Windows has no installer: the app replaces its own file. "nsis" is only the name the manifest format wants.
            entry windows-x86_64 'Fractique_*_x64.exe' nsis
            entry linux-x86_64 'Fractique_*_x86_64.AppImage' appimage
            entry macos-aarch64 '*_aarch64.app.tar.gz' app
          } | jq -s 'add // {}' > ../platforms.json
          jq -n --arg v "$VERSION" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --rawfile n ../notes.md \
            --slurpfile p ../platforms.json '{version: $v, notes: $n, pub_date: $d, platforms: $p[0]}' > latest.json
          # The updater reads each signature from latest.json, so the .sig files are not published.
          rm -f ./*.sig
          sha256sum -- * > SHA256SUMS.txt
          jq . latest.json
          ls -l

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            # A full release, not a pre-release: the updater reads releases/latest, which skips pre-releases.
            gh release create "$GITHUB_REF_NAME" out/* --latest --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
