name: CI

# Entry point for the checks of the code: lint.yml and test.yml run from here. The title has a workflow of its own,
# title.yml: an edited title then leaves these checks as they were, instead of showing them as skipped.
# A push to master runs them too: a pull request may read the caches of master, not those of another pull request.
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Changed files
        id: diff
        run: |
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          check() { if grep -qE "$2" <<< "$files"; then echo "$1=true" >> "$GITHUB_OUTPUT"; fi; }
          check rust '^(crates|vendor)/|(^|/)(Cargo\.toml|Cargo\.lock|rustfmt\.toml|clippy\.toml|rust-toolchain\.toml)$|^\.github/workflows/(ci|lint|test)\.yml$'

  lint:
    name: Lint
    needs: changes
    uses: ./.github/workflows/lint.yml
    with:
      rust: ${{ needs.changes.outputs.rust == 'true' }}

  test:
    name: Tests
    needs: changes
    uses: ./.github/workflows/test.yml
    with:
      rust: ${{ needs.changes.outputs.rust == 'true' }}
