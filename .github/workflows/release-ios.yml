# It signs with an App Store Connect API key from the repository's secrets; docs/ios.md says how to make it.
name: Release iOS

on:
  workflow_call:
    secrets:
      ASC_KEY_P8:
        required: false
      ASC_KEY_ID:
        required: false
      ASC_ISSUER_ID:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  testflight:
    name: TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: The newest Xcode on the runner
        run: |
          newest="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -n1)"
          sudo xcode-select -s "$newest"
          xcodebuild -version
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: xcodegen
        run: brew install xcodegen
      - name: Build, sign and upload
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::error::The secrets ASC_KEY_P8, ASC_KEY_ID and ASC_ISSUER_ID are not set. See docs/ios.md."
            exit 1
          fi
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          ./scripts/ios/testflight.sh
