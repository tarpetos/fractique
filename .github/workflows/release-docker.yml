name: Release Docker

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The image of the HTTP server with the web app, built on a runner of each kind of processor rather than emulated.
  image:
    name: Image (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The name and the version
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fractique-server" >> "$GITHUB_ENV"
          echo "VERSION=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_ENV"

      - name: Build
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.description=Fractique: the HTTP server with the web app" \
            -t "$IMAGE:$VERSION-${{ matrix.arch }}" .

      - name: The server answers
        run: |
          docker run -d --name fractique -p 8080:8080 "$IMAGE:$VERSION-${{ matrix.arch }}"
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-all-errors http://localhost:8080/health
          curl --fail --silent --show-error --output /dev/null http://localhost:8080/
          curl --fail --silent --show-error --output /dev/null http://localhost:8080/presets
          docker rm -f fractique

      - name: Push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION-${{ matrix.arch }}"

  # One name for both: Docker picks the image of the machine's processor.
  manifest:
    name: Image for both processors
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Join the two images
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fractique-server"
          version="${GITHUB_REF_NAME#v}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$image:$version" -t "$image:latest" "$image:$version-amd64" "$image:$version-arm64"
