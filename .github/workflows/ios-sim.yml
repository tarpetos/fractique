# Starts the app in the iOS Simulator and keeps a screenshot of it. Started by hand only: macOS minutes are costly.
name: iOS simulator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    name: Run in the simulator
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build Fractique.app
        run: ./scripts/ios/bundle.sh aarch64-apple-ios-sim
      - name: Run it
        run: |
          app=target/ios/aarch64-apple-ios-sim/Fractique.app
          codesign --force --sign - "$app"
          xcrun simctl list devices available | grep -E 'iPhone' | head -20
          device="$(xcrun simctl list devices available | sed -nE 's/^ +iPhone[^(]*\(([0-9A-F-]{36})\).*/\1/p' | head -n1)"
          echo "Simulator: $device"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          mkdir -p out
          SIMCTL_CHILD_RUST_BACKTRACE=1 xcrun simctl launch --console-pty "$device" app.fractique > out/console.txt 2>&1 &
          sleep 40
          xcrun simctl io "$device" screenshot out/start.png
          sleep 15
          xcrun simctl io "$device" screenshot out/later.png
          xcrun simctl spawn "$device" log show --last 3m --predicate 'process == "Fractique" OR process == "ReportCrash" OR eventMessage CONTAINS[c] "fractique"' > out/system-log.txt 2>&1 || true
          xcrun simctl spawn "$device" launchctl list | grep -i fractique > out/running.txt 2>&1 || echo "not running" > out/running.txt
          mkdir -p out/crashes
          cp ~/Library/Logs/DiagnosticReports/*ractique* out/crashes/ 2>/dev/null || true
          find ~/Library/Developer/CoreSimulator/Devices/"$device"/data/Library/Logs -iname '*ractique*' -exec cp {} out/crashes/ \; 2>/dev/null || true
          ls -la out out/crashes
          cat out/running.txt
          tail -60 out/console.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-simulator
          path: out
