name: Release desktop

on:
  workflow_call:
    secrets:
      CARGO_PACKAGER_SIGN_PRIVATE_KEY:
        required: false
      CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            kind: windows
          # 22.04 (glibc 2.35) so the AppImage also runs on older distributions.
          - name: Linux x64
            os: ubuntu-22.04
            kind: linux
          # One universal build, for Apple Silicon and Intel.
          - name: macOS
            os: macos-latest
            kind: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.os }}

      - name: Linux build dependencies
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan-dev file

      - name: Signing key
        shell: bash
        env:
          KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEY" ]; then
            echo "CARGO_PACKAGER_SIGN_PRIVATE_KEY=$KEY" >> "$GITHUB_ENV"
            echo "CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key: the installers are not signed for updates."
          fi

      - name: Build (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: ./scripts/build/build-win.ps1

      - name: Build (Linux)
        if: matrix.kind == 'linux'
        run: ./scripts/build/build-linux.sh

      - name: Build (macOS)
        if: matrix.kind == 'macos'
        run: ./scripts/build/build-mac.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.kind }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.tar.gz
            dist/*.sig
