name: Tests

on:
  workflow_call:
    inputs:
      rust:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # The golden hashes in crates/fractique-core/tests/determinism.rs must match on every system: this matrix is
  # what proves that a scene renders to the same pixels everywhere.
  rust:
    name: Rust (${{ matrix.name }})
    if: inputs.rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: Windows x64
            os: windows-latest
          - name: macOS Apple Silicon
            os: macos-latest
          - name: macOS Intel
            os: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.os }}
      - run: cargo test --locked --release
      - name: Without threads
        run: cargo test --locked --release -p fractique-core --no-default-features
