name: Fractique
options:
  deploymentTarget:
    macOS: "12.0"
settings:
  base:
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FractiquePro:
    type: framework
    platform: macOS
    sources:
      - ../ios/ProWatch.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fractique.ProWatch
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        DEFINES_MODULE: NO
  Fractique:
    dependencies:
      - target: FractiquePro
    type: application
    platform: macOS
    sources:
      - stub.c
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fractique
        PRODUCT_NAME: Fractique
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Fractique.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_DEBUG_DYLIB: NO
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: NO
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Fractique
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.graphics-design
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        ITSAppUsesNonExemptEncryption: false
    postBuildScripts:
      - name: Build Rust app
        path: build-rust.sh
        basedOnDependencyAnalysis: false
