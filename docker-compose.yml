services:
  fractique:
    build: .
    image: fractique-server
    ports:
      - "8080:8080"
    environment:
      FRACTIQUE_JOBS: "1"
      FRACTIQUE_QUEUE: "8"
      FRACTIQUE_MAX_SIDE: "4096"
      FRACTIQUE_MAX_PIXELS: "8294400"
      FRACTIQUE_MAX_SAMPLES: "1000"
      FRACTIQUE_MAX_SUPERSAMPLE: "2"
      FRACTIQUE_TIMEOUT: "120"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
